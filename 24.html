<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>極簡送貨與驗證系統（中國手機相容版）</title>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --ink: #0f172a;
      --cyan: #0284c7;
      --bg: #f8fafc;
      --muted: #64748b;
      --ok: #059669;
      --bad: #dc2626;
      --wechat: #07c160;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-size: 18px;
    }
    .app {
      max-width: 560px;
      margin: auto;
      min-height: 100vh;
      background: #fff;
      padding-bottom: 64px;
    }
    .head {
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }
    .eyebrow {
      color: #38bdf8;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.1em;
    }
    h1 {
      font-size: 24px;
      margin: 6px 0 12px;
    }
    .runner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 17px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .switch-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 2px solid #cbd5e1;
    }
    .tabs button {
      background: #fff;
      border: 0;
      padding: 16px;
      font-size: 18px;
      font-weight: 900;
      color: #64748b;
      cursor: pointer;
    }
    .tabs button.active {
      color: #0f172a;
      border-bottom: 4px solid var(--cyan);
      background: #f0f9ff;
    }
    .card {
      border: 2px solid #cbd5e1;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 18px;
      background: #fff;
    }
    .step {
      color: #0284c7;
      font-weight: 900;
      letter-spacing: 0.05em;
      font-size: 15px;
    }
    .title {
      font-size: 21px;
      font-weight: 900;
      margin: 4px 0 8px;
    }
    .hint {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      width: 100%;
    }
    .row input, .row select {
      flex: 1;
      min-width: 0;
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 18px;
      font-weight: bold;
    }
    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .ok {
      background: #d1fae5;
      color: #065f46;
      border: 2px solid #10b981;
    }
    .bad {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #ef4444;
    }
    .tag-nonhub {
      display: inline-block;
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      margin-left: 8px;
      background: #f59e0b;
    }
    .tag-type {
      background: #0284c7;
      color: #fff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      margin-left: 8px;
    }
    .camera {
      width: 100%;
      height: 96px;
      border: 3px dashed #94a3b8;
      border-radius: 16px;
      background: #f8fafc;
      font-size: 18px;
      color: #334155;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      cursor: pointer;
    }
    .photos {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .photo {
      position: relative;
      width: 80px;
      height: 80px;
    }
    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
    }
    .photo button {
      position: absolute;
      right: -6px;
      top: -6px;
      border: 0;
      border-radius: 50%;
      background: #000;
      color: #fff;
      width: 26px;
      height: 26px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 18px;
    }
    .complete-btn, .wechat-btn, .export-btn, .admin-btn, .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      color: #fff;
      font-weight: 900;
      padding: 16px;
      font-size: 19px;
      cursor: pointer;
    }
    .complete-btn { background: var(--ok); }
    .wechat-btn { background: var(--wechat); }
    .export-btn { background: var(--cyan); }
    .admin-btn { background: #dc2626; }
    .primary-btn { background: #0f172a; margin-top: 16px; }
    .history-wechat-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--wechat);
      color: #fff;
      font-weight: 900;
      padding: 12px;
      font-size: 16px;
      margin-top: 12px;
      cursor: pointer;
    }
    button:disabled {
      background: #e2e8f0 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }
    .button-action {
      background: #fff;
      border: 3px solid #0284c7;
      color: #0284c7;
      padding: 14px 16px;
      border-radius: 16px;
      font-weight: 900;
      font-size: 17px;
      text-align: center;
      cursor: pointer;
    }
    .hidden { display: none !important; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scanbox {
      width: min(100%, 500px);
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      max-height: 94vh;
      overflow: auto;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .scan-reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 72%;
      height: 90px;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.52);
      pointer-events: none;
    }
    .scan-laser {
      position: absolute;
      top: 50%;
      left: 6%;
      right: 6%;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: laserScan 1.6s infinite ease-in-out;
    }
    @keyframes laserScan {
      0%, 100% { transform: translateY(-28px); }
      50% { transform: translateY(28px); }
    }
    .engine-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e0f2fe;
      color: #0369a1;
      margin-bottom: 8px;
    }
    .scanbox h3 {
      font-size: 21px;
      margin: 4px 0 8px;
      text-align: center;
    }
    .system-camera-btn {
      width: 100%;
      border: 0;
      border-radius: 16px;
      background: #f59e0b;
      color: #fff;
      padding: 15px;
      font-size: 17px;
      font-weight: 900;
      margin-top: 12px;
      cursor: pointer;
    }
    .scan-error {
      font-size: 14px;
      color: #991b1b;
      background: #fee2e2;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }
    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 20px;
      max-width: 520px;
      margin: auto;
      background: rgba(15, 23, 42, 0.95);
      color: #fff;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.45;
      z-index: 40;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .login {
      min-height: 100vh;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loginbox {
      background: #fff;
      padding: 28px;
      border-radius: 28px;
      width: 100%;
      max-width: 460px;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <div id="browserAlert" class="hidden" style="background:#f59e0b;color:#fff;padding:12px 16px;font-size:15px;font-weight:bold;text-align:center;">
    如即時相機不能使用，請直接使用「系統相機掃描」。
  </div>

  <div id="login" class="login">
    <div class="loginbox">
      <div class="eyebrow">送貨管理系統</div>
      <h1 style="font-size:24px;color:#0f172a;">請輸入人員工號</h1>
      <div class="row">
        <input id="staff" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="請輸入人員工號" oninput="checkStaffSavedType()" />
        <button class="button-action" type="button" onclick="openScanner('staff')">掃描</button>
      </div>
      <div style="margin-top:18px;">
        <label class="hint" style="font-weight:bold;color:#0f172a;display:block;margin-bottom:8px;">選擇貨物類型：</label>
        <div class="row" style="margin-top:0;">
          <select id="deliveryTypeSelect">
            <option value="街貨">街貨</option>
            <option value="倉貨">倉貨</option>
          </select>
        </div>
      </div>
      <button class="primary-btn" type="button" onclick="login()">進入系統</button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="head">
      <div class="eyebrow">送貨系統 · Scanner V4</div>
      <h1>目的地比對與拍照驗證</h1>
      <div class="runner">
        <div>
          送貨員：<b id="runner" style="color:#38bdf8;"></b>
          <span>｜類型：<b id="runnerType" style="color:#38bdf8;"></b></span>
          <span onclick="openChangeTypeModal()" style="text-decoration:underline;cursor:pointer;color:#38bdf8;font-weight:bold;margin-left:6px;">更改</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span>今日已送：<b id="transCount" style="color:#38bdf8;">0</b> 單</span>
          <button class="switch-btn" type="button" onclick="logout()">重新登入</button>
        </div>
      </div>
    </header>

    <div class="tabs">
      <button id="twork" class="active" type="button" onclick="tab('work')">開始送貨</button>
      <button id="thistory" type="button" onclick="tab('history')">歷史記錄</button>
    </div>

    <main id="work" style="padding:20px;">
      <section class="card">
        <div class="step">第一步</div>
        <div class="title">掃描貨卡條碼（送貨點）</div>
        <div class="row" style="margin-top:10px;">
          <input id="binInput" type="text" placeholder="輸入或掃描貨卡條碼" oninput="applyBinCard(this.value)" />
          <button class="button-action" type="button" onclick="openScanner('bincard')">掃描貨卡條碼</button>
        </div>
        <div id="binCardStatus"></div>
      </section>

      <section id="destCard" class="card hidden">
        <div class="step">第二步</div>
        <div class="title">驗證目的地條碼</div>
        <div class="hint">必須與第一步刷入的貨卡目的地一致。</div>
        <div class="row" style="margin-top:10px;">
          <input id="destInput" type="text" placeholder="輸入或掃描目的地條碼" oninput="applyDestination(this.value)" />
          <button class="button-action" type="button" onclick="openScanner('dest')">掃描目的地條碼</button>
        </div>
        <div id="destStatus"></div>
      </section>

      <section id="photoCard" class="card hidden">
        <div id="photoStepTitle" class="step">第三步</div>
        <div class="title">拍照留底</div>
        <div class="camera" onclick="openProofCamera()">點擊開啟相機拍照</div>
        <input id="proofSystemInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="handleProofSystemPhoto(event)" />
        <div id="photos" class="photos"></div>
        <div class="btn-group">
          <button id="completeBtn" class="complete-btn" type="button" disabled onclick="completeDelivery(false)">完成送貨</button>
          <button id="wechatBtn" class="wechat-btn" type="button" disabled onclick="completeDelivery(true)">完成並分享至 WeChat</button>
        </div>
      </section>

      <div id="success" class="toast hidden" style="background:#059669;">送貨記錄已成功完成！</div>
    </main>

    <main id="history" class="hidden" style="padding:20px;">
      <div class="row" style="margin-top:0;">
        <input id="search" type="text" placeholder="搜尋貨卡／目的地／類型" oninput="renderHistory()" />
      </div>
      <div class="row" style="margin-top:12px;">
        <input type="date" id="exportDate" />
        <button class="export-btn" type="button" style="width:auto;padding:12px 16px;font-size:16px;" onclick="exportDeliveryArchive()">匯出並傳送至 WeChat (.zip)</button>
      </div>
      <button class="button-action" type="button" style="width:100%;margin-top:14px;" onclick="showShareDiagnostics()">分享功能檢查</button>
      <div id="downloadArea" style="margin-top:12px;"></div>
      <button class="admin-btn" type="button" style="margin-top:14px;" onclick="adminClearRecords()">管理員清空記錄 (Admin)</button>
      <div id="records" style="margin-top:20px;"></div>
    </main>
  </div>

  <div id="typeModal" class="overlay hidden">
    <div class="scanbox" style="text-align:center;padding:28px;">
      <h3>請選擇要更改的貨物類型</h3>
      <div style="display:flex;flex-direction:column;gap:14px;margin-top:16px;">
        <button class="button-action" type="button" onclick="selectNewType('街貨')">街貨</button>
        <button class="button-action" type="button" onclick="selectNewType('倉貨')">倉貨</button>
        <button class="button-action" type="button" style="border-color:#94a3b8;color:#475569;" onclick="closeChangeTypeModal()">取消</button>
      </div>
    </div>
  </div>

  <div id="imageModal" class="overlay hidden" onclick="closeImageModal()">
    <div style="max-width:90%;max-height:90%;text-align:center;">
      <img id="modalImg" src="" alt="預覽圖片" style="max-width:100%;max-height:85vh;border-radius:16px;" />
      <p style="color:#fff;margin-top:10px;">點擊任意處關閉圖片</p>
    </div>
  </div>

  <div id="scanner" class="overlay hidden">
    <div class="scanbox" style="text-align:center;">
      <span id="engineBadge" class="engine-badge">偵測引擎初始化...</span>
      <h3 id="scanTitle">對準條碼進行掃描</h3>
      <div id="liveCameraArea" class="video-wrapper">
        <video id="video" autoplay muted playsinline></video>
        <div class="scan-reticle">
          <div class="scan-laser"></div>
        </div>
      </div>
      <p id="scanMsg" class="hint" style="text-align:center;font-weight:bold;color:#0284c7;margin-top:10px;">請將單一目標條碼放入藍色框內</p>
      <div id="scanError" class="scan-error hidden"></div>
      <button class="system-camera-btn" type="button" onclick="openSystemScanner()">系統相機掃描（如無法即時掃描請用此功能）</button>
      <input id="systemCameraInput" type="file" accept="image/*" capture="environment" class="hidden" onchange="handleSystemScanImage(event)" />
      <button class="button-action" type="button" style="width:100%;margin-top:12px;" onclick="closeScanner()">關閉相機</button>
    </div>
  </div>

  <div id="proofCamera" class="overlay hidden">
    <div class="scanbox" style="text-align:center;">
      <h3>即時拍照留底</h3>
      <video id="proofVideo" autoplay muted playsinline style="width:100%;height:300px;object-fit:cover;border-radius:16px;background:#000;"></video>
      <canvas id="proofCanvas" class="hidden"></canvas>
      <div class="row">
        <button class="complete-btn" type="button" onclick="takeProofPhoto()">拍照</button>
        <button class="system-camera-btn" type="button" style="margin-top:0;" onclick="useSystemProofCamera()">改用系統相機</button>
      </div>
      <button class="button-action" type="button" style="width:100%;margin-top:12px;" onclick="closeProofCamera()">取消</button>
    </div>
  </div>

  <script>
    const KEY = 'simple_delivery_v3';
    const DB_NAME = 'simple_delivery_db_v3';
    const DB_VERSION = 1;
    const STORE_RECORDS = 'records';

    let dbInstance = null;
    let runner = null;
    let binCard = null;
    let isNonHub = false;
    let destination = null;
    let photos = [];
    let scanTarget = null;
    let codeReader = null;
    let isProcessingScan = false;
    let nativeScanLoopId = null;
    let activeScanStream = null;
    let proofStream = null;
    let scannerV4Timer = null;
    let scannerV4StartedAt = 0;
    let scannerV4Attempts = 0;
    let scannerV4SecondaryStarted = false;
    let records = [];
    let today = new Date().toLocaleDateString('sv-SE');
    let toastTimer = null;

    // --- IndexedDB 儲存層（只替換 records 儲存，保留原本 photos DataURL 結構） ---
    function openDeliveryDB() {
      if (dbInstance) return Promise.resolve(dbInstance);
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB not supported'));
          return;
        }
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_RECORDS)) {
            db.createObjectStore(STORE_RECORDS, { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          resolve(dbInstance);
        };
        req.onerror = () => reject(req.error || new Error('IndexedDB open error'));
      });
    }

    async function idbGetAllRecords() {
      const db = await openDeliveryDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_RECORDS, 'readonly');
        const store = tx.objectStore(STORE_RECORDS);
        const req = store.getAll();
        req.onsuccess = () => {
          const list = Array.isArray(req.result) ? req.result : [];
          // 保持最新記錄排最前（與原本 records.unshift 行為一致）
          list.sort((a, b) => String(b.id || '').localeCompare(String(a.id || '')));
          resolve(list);
        };
        req.onerror = () => reject(req.error || new Error('IndexedDB getAll error'));
      });
    }

    async function idbPutRecord(rec) {
      const db = await openDeliveryDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_RECORDS, 'readwrite');
        const store = tx.objectStore(STORE_RECORDS);
        const req = store.put(rec);
        req.onsuccess = () => resolve(true);
        req.onerror = () => reject(req.error || new Error('IndexedDB put error'));
      });
    }

    async function idbClearRecords() {
      const db = await openDeliveryDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_RECORDS, 'readwrite');
        const store = tx.objectStore(STORE_RECORDS);
        const req = store.clear();
        req.onsuccess = () => resolve(true);
        req.onerror = () => reject(req.error || new Error('IndexedDB clear error'));
      });
    }

    function showToast(msg, duration = 4200) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), duration);
    }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function playBeep() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const c = new Ctx();
        const o = c.createOscillator();
        const g = c.createGain();
        o.frequency.value = 1050;
        g.gain.value = 0.15;
        o.connect(g);
        g.connect(c.destination);
        o.start();
        o.stop(c.currentTime + 0.12);
      } catch (e) {}
    }

    async function init() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes('micromessenger') || ua.includes('wv') || ua.includes('huawei') || ua.includes('harmony')) {
        document.getElementById('browserAlert').classList.remove('hidden');
      }
      try {
        records = await idbGetAllRecords();
      } catch (e) {
        records = [];
        showToast('IndexedDB 讀取失敗：' + (e && e.message ? e.message : '請檢查瀏覽器儲存權限'));
      }
      const saved = JSON.parse(localStorage.getItem(KEY + '_runner') || 'null');
      if (saved && saved.date === today) {
        runner = saved;
        showApp();
      }

    function scanFailure(msg) {

    function stopActiveCamera() {
      if (scannerV4Timer) {
        clearTimeout(scannerV4Timer);
        scannerV4Timer = null;
      }
      if (nativeScanLoopId) {
        clearTimeout(nativeScanLoopId);
        nativeScanLoopId = null;
      }
      if (activeScanStream) {
        activeScanStream.getTracks().forEach(t => {
          try { t.stop(); } catch (e) {}
        });
        activeScanStream = null;
      }
      if (codeReader) {
        try { codeReader.reset(); } catch (e) {}
      }
      const v = document.getElementById('video');
      try { v.pause(); } catch (e) {}
      v.srcObject = null;
    }

    function closeScanner() {

    function openSystemScanner() {
      stopActiveCamera();
      document.getElementById('engineBadge').textContent = '系統相機模式';
      document.getElementById('scanMsg').textContent = '請拍攝清晰、完整、正面的條碼';
      const input = document.getElementById('systemCameraInput');

    async function handleSystemScanImage(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      document.getElementById('scanMsg').textContent = '正在辨識相片中的條碼...';
      try {
        if (!window.ZXing) throw new Error('ZXing not loaded');
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = async () => {
          try {
            const hints = new Map();
            hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
            const reader = new ZXing.BrowserMultiFormatReader(hints);
            const result = await reader.decodeFromImageElement(img);
            URL.revokeObjectURL(url);
            if (result && result.text) {
              handleScanSuccess(result.text);
              return;
            }
            throw new Error('NotFound');
          } catch (e) {
            URL.revokeObjectURL(url);
            scanFailure('未能辨識條碼，請靠近拍攝、保持條碼完整及避免反光。');
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          scanFailure('相片讀取失敗');
        };
        img.src = url;
      } catch (e) {
        scanFailure('辨識引擎無法使用');
      }
    }

    async function openScanner(target) {
      scanTarget = target;
      isProcessingScan = false;
      scannerV4SecondaryStarted = false;
      scannerV4Attempts = 0;
      scannerV4StartedAt = performance.now();

      document.getElementById('scanner').classList.remove('hidden');
      document.getElementById('scanError').classList.add('hidden');
      document.getElementById('scanTitle').textContent =
        target === 'staff' ? '請掃描人員工號' :
        target === 'bincard' ? '請掃描貨卡條碼' : '請掃描目的地條碼';
      document.getElementById('scanMsg').textContent = '請將條碼置於畫面中央，V4 會使用完整畫面辨識';

      if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        scanFailure('此瀏覽器不能使用即時相機，請使用「系統相機掃描」。');
        return;
      }

      const video = document.getElementById('video');
      const modes = [
        { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
        { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
        { video: { facingMode: { ideal: 'environment' } }, audio: false },
        { video: true, audio: false }
      ];

      let stream = null;
      let lastErr = null;
      for (const c of modes) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(c);
          break;
        } catch (e) {
          lastErr = e;
        }
      }

      if (!stream) {
        scanFailure('臨時相機無法啟動 (' + (lastErr && lastErr.name ? lastErr.name : 'CameraError') + ')');
        return;
      }

      activeScanStream = stream;
      video.srcObject = stream;
      video.setAttribute('playsinline', 'true');
      video.muted = true;
      try {
        await video.play();
      } catch (e) {
        scanFailure('相機預覽失敗，請使用系統相機掃描。');
        return;
      }

      document.getElementById('engineBadge').textContent = 'V4 ZXing 掃描模式';
      startZXingPrimary(video);
      scannerV4Timer = setTimeout(() => {
        if (!isProcessingScan) startNativeSecondary(video);
      }, 3000);
    }

    function startZXingPrimary(video) {
      if (!window.ZXing) {
        scanFailure('ZXing 掃描程式未能載入。');
        return;
      }
      try { codeReader.reset(); } catch (e) {}
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      codeReader = new ZXing.BrowserMultiFormatReader(hints);
      codeReader.decodeFromVideoElement(video, (result) => {
        if (isProcessingScan) return;
        scannerV4Attempts++;
        if (result && result.text) {
          handleScanSuccess(result.text);
        }
      });
    }

    async function startNativeSecondary(video) {
      if (scannerV4SecondaryStarted || isProcessingScan) return;
      scannerV4SecondaryStarted = true;
      if (!('BarcodeDetector' in window)) return;
      try {
        const supported = await BarcodeDetector.getSupportedFormats();
        const wanted = ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'codabar', 'itf'];
        const formats = wanted.filter(f => supported.includes(f));
        const detector = new BarcodeDetector({ formats: formats.length ? formats : supported });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const loop = async () => {
          if (isProcessingScan || !activeScanStream) return;
          if (video.videoWidth && video.videoHeight) {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
            try {
              const found = await detector.detect(canvas);
              if (found && found[0] && found[0].rawValue) {
                handleScanSuccess(found[0].rawValue);
                return;
              }
            } catch (e) {}
          }
          nativeScanLoopId = setTimeout(loop, 180);
        };
        loop();
      } catch (e) {}
    }

    function handleScanSuccess(text) {
      if (isProcessingScan || !text) return;
      isProcessingScan = true;
      playBeep();
      if (navigator.vibrate) {
        try { navigator.vibrate(100); } catch (e) {}
      }
      const clean = String(text).trim();
      if (scanTarget === 'staff') {
        document.getElementById('staff').value = clean;
        checkStaffSavedType();
      } else if (scanTarget === 'bincard') {
        document.getElementById('binInput').value = clean;
        applyBinCard(clean);
      } else if (scanTarget === 'dest') {
        document.getElementById('destInput').value = clean;
        applyDestination(clean);
      }
      closeScanner();
    }

    function buildShareText(rec) {
      return [
        '【送貨完成記錄】',
        '貨卡：' + rec.binCard,
        '目的地：' + rec.destination,
        '貨物類型：' + (rec.deliveryType || '街貨'),

      ].join('\n');

    function dataURLToFiles(rec) {
      const files = [];
      (rec.photos || []).forEach((dataURL, idx) => {
        try {
          const parts = dataURL.split(',');
          if (parts.length < 2) return;
          const mimeMatch = parts[0].match(/:(.*?);/);
          const mime = (mimeMatch && mimeMatch[1]) || 'image/jpeg';
          const bytes = atob(parts[1]);
          const arr = new Uint8Array(bytes.length);
          for (let j = 0; j < bytes.length; j++) arr[j] = bytes.charCodeAt(j);
          files.push(new File([arr], 'delivery_' + rec.id + '_' + (idx + 1) + '.jpg', {
            type: mime,
            lastModified: Date.now()
          }));
        } catch (e) {
          console.warn('Photo file conversion failed', e);
        }
      });
      return files;
    }

    async function copyTextQuietly(text) {
      if (!text) return false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    function downloadFilesLocally(files) {
      (files || []).forEach((f, idx) => {
        setTimeout(() => {
          const u = URL.createObjectURL(f);
          const a = document.createElement('a');
          a.href = u;
          a.download = f.name;
          a.style.display = 'none';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(u), 3000);
        }, idx * 250);
      });
    }

    async function fallbackShare(text, files, reason) {
      await copyTextQuietly(text);
      if (files && files.length) {
        downloadFilesLocally(files);
        showToast(reason + '｜已自動複製文字並下載相片，請於 WeChat 貼上文字並附加相片。', 5200);
      } else {
        showToast(reason + '｜已自動複製文字記錄，請於 WeChat 貼上。', 4200);
      }
    }

    async function shareToWeChatAction(rec) {
      const text = buildShareText(rec);
      const files = dataURLToFiles(rec);
      const hasShare = typeof navigator.share === 'function';
      const hasCanShare = typeof navigator.canShare === 'function';

      if (!window.isSecureContext) {
        return fallbackShare(text, files, '目前非 HTTPS 環境');
      }

      if (hasShare && hasCanShare && files.length > 0) {
        try {
          if (navigator.canShare({ files })) {
            await navigator.share({ files });
            await copyTextQuietly(text);
            showToast('已喚起分享（文字已同步複製，如需要可貼上）。', 3500);
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }

      if (hasShare) {
        try {
          await navigator.share({ title: '送貨完成記錄', text });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }

      return fallbackShare(text, files, '瀏覽器限制直接傳送檔案');
    }

    async function exportDeliveryArchive() {
      const selected = document.getElementById('exportDate').value;
      const ex = records.filter(r => {
        if (!selected) return true;
        const d = new Date(r.completedAt);
        if (isNaN(d.getTime())) return String(r.completedAt || '').includes(selected);
        return d.toLocaleDateString('sv-SE') === selected;
      });

      if (!ex.length) {
        showToast('所選日期沒有可匯出的送貨記錄。');
        return;
      }
      if (typeof JSZip === 'undefined') {
        showToast('打包元件 JSZip 尚未載入。');
        return;
      }

      const zip = new JSZip();
      let csv = 'ID,StaffNumber,DeliveryType,BinCard,Destination,CompleteTime,PhotoFiles\n';
      const folder = zip.folder('Photos');
      let n = 1;

      ex.forEach(r => {
        const fs = r.photos || [];
        const names = [];
        fs.forEach(p => {
          const parts = String(p).split(',');
          if (parts.length < 2) return;
          const mimeMatch = parts[0].match(/:(.*?);/);
          const ext = (mimeMatch && mimeMatch[1] && mimeMatch[1].includes('png')) ? 'png' : 'jpg';
          const fn = (r.runner && r.runner.staffId ? r.runner.staffId : 'unknown') + '_' + (selected || 'all') + '_' + String(n++).padStart(3, '0') + '.' + ext;
          folder.file(fn, parts[1], { base64: true });
          names.push('Photos/' + fn);
        });
        csv += [
          r.id,
          (r.runner && r.runner.staffId) || '',
          r.deliveryType || '街貨',
          r.binCard || '',
          r.destination || '',
          r.completedAt || '',
          names.join(';')
        ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',') + '\n';
      });

      zip.file('Delivery_Report.csv', '\uFEFF' + csv);
      const blob = await zip.generateAsync({ type: 'blob' });
      const fn = 'Delivery_Archive_' + (selected || 'all') + '.zip';
      const file = new File([blob], fn, { type: 'application/zip' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ title: '每日送貨報表與相片', files: [file] });
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }

      const u = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = u;
      a.download = fn;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 3000);

      document.getElementById('downloadArea').innerHTML =
        '<div class="hint">已下載 <b>' + esc(fn) + '</b>，請於檔案管理中分享至 WeChat。</div>';
      showToast('已下載 ' + fn + '，請於 WeChat 選擇檔案傳送。', 4500);
    }

    async function adminClearRecords() {
      const p = prompt('請輸入管理員密碼以清空記錄：');
      if (p === '888888') {
        try {
          await idbClearRecords();
          records = [];
          renderHistory();
          updateCountDisplay();
          showToast('已成功清空所有歷史記錄與相片空間！');
        } catch (e) {
          showToast('清空 IndexedDB 失敗：' + (e && e.message ? e.message : '請重試'));
        }
      } else if (p !== null) {
        showToast('密碼錯誤！');
      }
    }

    init();
  </script>
</body>
</html>
